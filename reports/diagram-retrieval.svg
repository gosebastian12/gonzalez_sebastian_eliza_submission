<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="rt">
  <title id="rt">Hybrid Chroma retrieval path in EdgarHybridRAG.retrieve() before re-ranking</title>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#3d8bfd"/>
    </marker>
  </defs>
  <rect width="1200" height="790" fill="#121923"/>

  <text x="600" y="26" fill="#8b9bb4" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Hybrid retrieval (Chroma)</text>
  <text x="600" y="44" fill="#6b7a92" font-family="Segoe UI,system-ui,sans-serif" font-size="10" text-anchor="middle">Natural-language question to deduplicated candidate chunks (before re-ranking)</text>

  <!-- Step 1: icon on the left; icon + text block vertically centered in the row -->
  <rect x="160" y="54" width="880" height="70" rx="10" fill="#1a2436" stroke="#3d8bfd" stroke-width="1.5"/>
  <g transform="translate(180, 71.5)" aria-hidden="true">
    <rect x="0" y="10" width="22" height="3" rx="1" fill="#3d8bfd"/>
    <rect x="0" y="16" width="16" height="3" rx="1" fill="#5a9dff"/>
    <rect x="0" y="22" width="10" height="3" rx="1" fill="#8b9bb4"/>
  </g>
  <text x="218" y="86" fill="#e8eef7" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start">Derive metadata filters</text>
  <text x="218" y="102" fill="#8b9bb4" font-family="Segoe UI,system-ui,sans-serif" font-size="9" text-anchor="start">Form, quarter, dates, tickers from the question</text>

  <!-- Step 2: same layout - left icon, text start; vertically centered as a unit -->
  <rect x="160" y="132" width="880" height="70" rx="10" fill="#1a2436" stroke="#3d8bfd" stroke-width="1.5"/>
  <g transform="translate(180, 145)" aria-hidden="true">
    <circle cx="12" cy="22" r="10" stroke="#3d8bfd" stroke-width="1.5" fill="none"/>
    <path d="M6,22 Q12,16 18,22 T30,22" fill="none" stroke="#3d8bfd" stroke-width="1.2"/>
  </g>
  <text x="218" y="163" fill="#e8eef7" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start">Embed the question</text>
  <text x="218" y="179" fill="#8b9bb4" font-family="Segoe UI,system-ui,sans-serif" font-size="9" text-anchor="start">Same vector used for every Chroma lookup in this pass</text>

  <line x1="600" y1="124" x2="600" y2="132" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="600" y1="202" x2="600" y2="212" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Diamond: clear gap below step 2 (ends 192); bottom 308 before boxes at 318 -->
  <polygon points="600,212 502,294 600,376 698,294" fill="#263042" stroke="#3d8bfd" stroke-width="2"/>
  <text x="600" y="274" fill="#e8eef7" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Two or more</text>
  <text x="600" y="292" fill="#e8eef7" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">companies?</text>
  <text x="600" y="310" fill="#8b9bb4" font-family="Segoe UI,system-ui,sans-serif" font-size="9" text-anchor="middle">tickers detected in the prompt</text>

  <!-- Yes / No near horizontal segment of elbow -->
  <text x="378" y="286" fill="#3d8bfd" font-family="Segoe UI,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Yes</text>
  <line x1="502" y1="294" x2="268" y2="294" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="268" y1="294" x2="268" y2="382" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>

  <text x="822" y="286" fill="#3d8bfd" font-family="Segoe UI,sans-serif" font-size="10" font-weight="600" text-anchor="middle">No</text>
  <line x1="698" y1="294" x2="932" y2="294" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="932" y1="294" x2="932" y2="382" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Branch boxes below diamond bottom (376 + 6px gap) -->
  <rect x="28" y="382" width="480" height="148" rx="10" fill="#0c1117" stroke="#3d8bfd" stroke-width="1.5"/>
  <text x="268" y="406" fill="#8b9bb4" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Per-company retrieval</text>
  <g transform="translate(78,422)">
    <rect x="0" y="0" width="36" height="44" rx="4" fill="#1a2436" stroke="#3d8bfd"/>
    <rect x="48" y="0" width="36" height="44" rx="4" fill="#1a2436" stroke="#3d8bfd"/>
    <rect x="96" y="0" width="36" height="44" rx="4" fill="#1a2436" stroke="#3d8bfd"/>
    <path d="M150,22 L210,22" stroke="#3d8bfd" stroke-width="2"/>
    <rect x="218" y="6" width="52" height="36" rx="6" fill="#263042" stroke="#5a9dff"/>
    <text x="244" y="28" fill="#e8eef7" font-family="Segoe UI,sans-serif" font-size="8" text-anchor="middle">merge</text>
  </g>
  <text x="268" y="498" fill="#e8eef7" font-family="Segoe UI,system-ui,sans-serif" font-size="10" text-anchor="middle">Each company: filtered search, then pool together</text>
  <text x="268" y="514" fill="#c9a227" font-family="Segoe UI,system-ui,sans-serif" font-size="9" text-anchor="middle">If that pool is empty: one combined filtered search</text>

  <!-- Single path: blue border, extra bottom padding for foot line -->
  <rect x="692" y="382" width="480" height="118" rx="10" fill="#0c1117" stroke="#3d8bfd" stroke-width="1.5"/>
  <text x="932" y="406" fill="#8b9bb4" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Single filtered search</text>
  <g transform="translate(820,418)">
    <rect x="0" y="12" width="100" height="8" rx="2" fill="#1a2436" stroke="#3d8bfd"/>
    <rect x="0" y="26" width="100" height="8" rx="2" fill="#1a2436" stroke="#3d8bfd"/>
    <rect x="0" y="40" width="100" height="8" rx="2" fill="#1a2436" stroke="#3d8bfd"/>
    <circle cx="118" cy="30" r="18" fill="none" stroke="#3d8bfd" stroke-width="2"/>
    <line x1="131" y1="43" x2="148" y2="58" stroke="#3d8bfd" stroke-width="2"/>
  </g>
  <text x="932" y="478" fill="#8b9bb4" font-family="Segoe UI,system-ui,sans-serif" font-size="9" text-anchor="middle">One vector query inside the metadata band</text>

  <line x1="268" y1="530" x2="268" y2="548" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="932" y1="500" x2="932" y2="548" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="548" y="532" width="104" height="32" rx="16" fill="#121923" stroke="#3d8bfd" stroke-width="2"/>
  <line x1="268" y1="548" x2="548" y2="548" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="932" y1="548" x2="652" y2="548" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="552" fill="#e8eef7" font-family="Segoe UI,sans-serif" font-size="9" font-weight="600" text-anchor="middle">Join</text>

  <rect x="160" y="578" width="880" height="88" rx="10" fill="#1a2436" stroke="#c9a227" stroke-width="2"/>
  <g transform="translate(188,598)">
    <circle cx="16" cy="16" r="14" fill="none" stroke="#c9a227" stroke-width="2"/>
    <text x="16" y="21" fill="#c9a227" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="middle">?</text>
  </g>
  <text x="230" y="608" fill="#e8eef7" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600">Still zero results while filters are on?</text>
  <text x="230" y="626" fill="#8b9bb4" font-family="Segoe UI,sans-serif" font-size="9">Widen: repeat vector search without metadata filter so the query can still match something.</text>
  <text x="230" y="648" fill="#8b9bb4" font-family="Segoe UI,sans-serif" font-size="9">If filters were already off, this step is skipped.</text>

  <line x1="600" y1="564" x2="600" y2="578" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Dedupe: all text centered in box -->
  <rect x="200" y="682" width="800" height="88" rx="10" fill="#0c1117" stroke="#3d8bfd" stroke-width="1.5"/>
  <text x="600" y="712" fill="#e8eef7" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Drop duplicate chunks</text>
  <text x="600" y="736" fill="#8b9bb4" font-family="Segoe UI,system-ui,sans-serif" font-size="9" text-anchor="middle">Same filing + section + chunk index appears only once</text>
  <text x="600" y="756" fill="#3d8bfd" font-family="Segoe UI,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Next: re-ranking slide</text>

  <line x1="600" y1="666" x2="600" y2="682" stroke="#3d8bfd" stroke-width="2" marker-end="url(#arr)"/>
</svg>
